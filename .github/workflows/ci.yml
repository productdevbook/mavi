name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Third-party actions run with whatever this grants, and nothing here writes.
permissions:
  contents: read

# On main a run is the record of what main is, so it is not cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether these exact files have already been checked, and which half of the
  # repository the change touches.
  #
  # A job with an `if` rather than a `paths:` filter on the trigger: a job
  # skipped by its own condition still reports, and satisfies a required check,
  # where a workflow that never starts leaves one pending forever.
  what:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # To find the earlier run that already checked these files.
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.should_skip }}
      paths: ${{ steps.check.outputs.paths_result }}
    steps:
      - id: check
        # Pinned to a commit, which cannot be moved under us the way a tag can.
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          paths_filter: |
            server:
              paths:
                - 'server/**'
                - '.github/workflows/ci.yml'
            server-next:
              paths:
                - 'server-next/**'
                - '.github/workflows/ci.yml'
            client:
              paths:
                - 'client/**'
                - '.github/workflows/ci.yml'

  # The server: twenty-one crates, a hundred and one endpoints, and a schema
  # that has to meet a real Postgres — because a check constraint nothing ever
  # ran is a claim rather than a rule.
  server:
    needs: what
    if: needs.what.outputs.skip != 'true' && !fromJSON(needs.what.outputs.paths).server.should_skip
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5434/mavi_crates
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      # Its own port, so that running beside the `server` job's Postgres is
      # two databases rather than one race.
      - name: A Postgres that is not protecting anything
        run: |
          docker run -d --name pgcrates \
            --tmpfs /var/lib/postgresql/data:rw,size=2g \
            -p 5434:5432 \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=mavi_crates \
            -e PGDATA=/var/lib/postgresql/data/pgdata \
            postgres:18-alpine \
            -c fsync=off \
            -c synchronous_commit=off \
            -c full_page_writes=off
          until docker exec pgcrates pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          cache-on-failure: true

      - uses: taiki-e/install-action@nextest

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace
      # A crate whose examples do not compile is a crate whose documentation
      # is wrong, and this one is nothing but documentation and vocabulary.
      - run: cargo test --workspace --doc

      # What the panel is written against is generated from the description
      # and committed, and one of the tests above writes it and compares. When
      # that one fails the corrected file is already in the tree, so it goes up
      # here — whoever broke it takes it rather than working out how to produce
      # it.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: the-panels-types
          path: client/src/api/mavi.ts

  # The clean rewrite has its own workspace and must not inherit the legacy
  # server job's working directory, cache or superuser database assumptions.
  server-next:
    needs: what
    if: needs.what.outputs.skip != 'true' && !fromJSON(needs.what.outputs.paths)['server-next'].should_skip
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server-next
    env:
      TEST_DATABASE_URL: postgres://mavi_test:mavi_test@localhost:5435/mavi_next
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: A non-superuser Postgres for RLS tests
        run: |
          docker run -d --name pg-next \
            --tmpfs /var/lib/postgresql/data:rw,size=2g \
            -p 5435:5432 \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -e PGDATA=/var/lib/postgresql/data/pgdata \
            postgres:18-alpine \
            -c fsync=off \
            -c synchronous_commit=off \
            -c full_page_writes=off
          until docker exec pg-next pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
          until docker exec pg-next psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "select 1" >/dev/null 2>&1; do sleep 1; done
          docker exec pg-next psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "create role mavi_test login password 'mavi_test' nocreatedb nosuperuser nobypassrls;" \
            -c "create database mavi_next owner mavi_test;"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-next
          cache-on-failure: true

      - uses: taiki-e/install-action@nextest

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace
      - run: cargo nextest run -p mavi-storage --test postgres --run-ignored all
      - run: cargo nextest run -p mavi-identity --test postgres --run-ignored all
      - run: cargo nextest run -p mavi-http --test identity --run-ignored all
      - run: cargo test --workspace --doc

  client:
    needs: what
    if: needs.what.outputs.skip != 'true' && !fromJSON(needs.what.outputs.paths).client.should_skip
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # A released version, not the canary: the lockfile format tracks the
          # bun version, and a canary writes one no release can read.
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      # `--bun` because vite's own bin declares node in its shebang, and
      # without it bun hands the build back to whatever node the image carries.
      #
      # Build before typecheck: vite generates the route tree that tsc reads.
      - run: bun run --bun build
      - run: bun run --bun lint



  # This repository is public, and what must never be in it is not a matter of
  # anybody remembering.
  nothing-that-should-not-be-here:
    needs: what
    if: needs.what.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The history as well, because a commit message is as public as the
          # code and this has been the way it got out before.
          fetch-depth: 0

      - name: Secrets
        # The scanner, not the action that wraps it: the action refuses to run
        # for an organisation without a licence key, and the scanner it would
        # have run is the same free binary. Pinned and checksummed because this
        # step is trusted with the whole history.
        env:
          GITLEAKS_VERSION: 8.30.1
          # One per architecture: which runner this lands on is not this
          # workflow's decision, and a checksum for the wrong one is a download
          # nobody checked.
          GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          case "$(uname -m)" in
            x86_64) arch=x64;   sha="$GITLEAKS_SHA256_X64" ;;
            aarch64) arch=arm64; sha="$GITLEAKS_SHA256_ARM64" ;;
            *) echo "no gitleaks build pinned for $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          echo "$sha  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          # Every commit, not the tree: something committed once is out whether
          # or not a later commit took it back out again.
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 .

      - name: Anything belonging to whoever is running it
        # What the change adds, not what the tree already holds: the tests are
        # full of invented addresses and a check that flags those is one that
        # gets turned off.
        run: ./scripts/nothing-of-theirs.sh origin/${{ github.base_ref || 'main' }}
