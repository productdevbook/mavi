# What somebody who has not cloned this runs.
#
# The compose file names the published API and panel images, so until this
# workflow has run once for a tag, `docker compose up` has nothing to pull and
# the quickest way to try this is building the development stack from source.
name: Release

on:
  push:
    tags: ["v*"]
  # For the first one, and for rebuilding a tag whose base image has been
  # patched underneath it.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, e.g. v0.1.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # The API and panel are separate images with one release/tag boundary.
      # The panel is never baked into the Rust runtime image, and the API never
      # serves an unversioned browser bundle.
      matrix:
        include:
          - name: mavi
            context: server
            file: Dockerfile
          - name: mavi-panel
            context: client
            file: Dockerfile
    steps:
      # What is asked for by hand is checked before it is used as a ref or
      # baked into an image name: a version is three numbers after a v, and
      # anything else is somebody's mistake or somebody's attempt.
      - id: version
        env:
          ASKED: ${{ inputs.tag }}
          PUSHED: ${{ github.ref_name }}
        run: |
          version="${ASKED:-$PUSHED}"
          case "$version" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a version: $version" >&2; exit 1 ;;
          esac
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}

      # arm64 as well as amd64: a machine somebody runs this on themselves is
      # as likely to be an Arm box as not, and an amd64-only image on one runs
      # under emulation slowly enough to look broken.
      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          # The tag itself and `latest`. No `main`: an image that moves under
          # somebody who pinned nothing is how an installation changes version
          # without anybody deciding to.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          secrets: |
            sccache-env=${{ secrets.SCCACHE_ENV }}

  smoke:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - id: version
        env:
          ASKED: ${{ inputs.tag }}
          PUSHED: ${{ github.ref_name }}
        run: |
          version="${ASKED:-$PUSHED}"
          case "$version" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a version: $version" >&2; exit 1 ;;
          esac
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start a fresh fixed-site installation
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 32 | tr -d '\n')"
            echo "MAVI_KEYS=1:$(openssl rand -base64 32 | tr -d '\n')"
            echo "MAVI_SITE_ID=$(cat /proc/sys/kernel/random/uuid)"
            echo "MAVI_DOMAIN=http://localhost"
            echo "MAVI_VERSION=${{ steps.version.outputs.tag }}"
          } > .env
          docker compose pull
          docker compose up -d

      - name: Run release smoke checks
        run: |
          if ! ./scripts/mavi-smoke.sh; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi

      - name: Tear down the smoke installation
        if: always()
        run: docker compose down -v
