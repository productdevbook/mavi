# What somebody who has not cloned this runs.
#
# The compose file names the published API and panel images, so until this
# workflow has run once for a tag, `docker compose up` has nothing to pull and
# the quickest way to try this is building the development stack from source.
name: Release

on:
  push:
    tags: ["v*"]
  # For the first one, and for rebuilding a tag whose base image has been
  # patched underneath it.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, e.g. v0.1.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    timeout-minutes: 60
    strategy:
      # Build every image on the architecture it will run on. Compiling the
      # Rust API for arm64 through QEMU makes a cold release take 30+ minutes;
      # native runners keep the multi-architecture contract without making
      # emulation part of the release path.
      matrix:
        include:
          - name: mavi
            context: server
            file: server/Dockerfile
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: mavi
            context: server
            file: server/Dockerfile
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: mavi-panel
            context: client
            file: client/Dockerfile
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: mavi-panel
            context: client
            file: client/Dockerfile
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # What is asked for by hand is checked before it is used as a ref or
      # baked into an image name: a version is three numbers after a v, and
      # anything else is somebody's mistake or somebody's attempt.
      - id: version
        env:
          ASKED: ${{ inputs.tag }}
          PUSHED: ${{ github.ref_name }}
        run: |
          version="${ASKED:-$PUSHED}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a version: $version" >&2
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          # Keep the multiline export file intact. Passing it through the
          # `secrets` input makes the action parse each line as a separate
          # secret declaration.
          SCCACHE_ENV: ${{ secrets.SCCACHE_ENV }}
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: true
          # Architecture tags are assembled into the public release tags by
          # the manifest job below. No `main`: an image that moves under
          # somebody who pinned nothing is how an installation changes version
          # without anybody deciding to.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.version.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
          # BuildKit mounts this environment secret at /run/secrets/sccache-env,
          # which is the file consumed by the Dockerfile wrapper.
          secret-envs: |
            sccache-env=SCCACHE_ENV

  manifests:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: version
        env:
          ASKED: ${{ inputs.tag }}
          PUSHED: ${{ github.ref_name }}
        run: |
          version="${ASKED:-$PUSHED}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a version: $version" >&2
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble multi-architecture release tags
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          for image in mavi mavi-panel; do
            source="ghcr.io/${OWNER}/${image}"
            docker buildx imagetools create \
              --tag "${source}:${TAG}" \
              "${source}:${TAG}-amd64" \
              "${source}:${TAG}-arm64"
            docker buildx imagetools create \
              --tag "${source}:latest" \
              "${source}:${TAG}-amd64" \
              "${source}:${TAG}-arm64"
            docker buildx imagetools inspect "${source}:${TAG}"
          done

  smoke:
    needs: manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - id: version
        env:
          ASKED: ${{ inputs.tag }}
          PUSHED: ${{ github.ref_name }}
        run: |
          version="${ASKED:-$PUSHED}"
          case "$version" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a version: $version" >&2; exit 1 ;;
          esac
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start a fresh fixed-site installation
        run: |
          {
            # Compose embeds this value in DATABASE_URL. Hex keeps the generated
            # password URI-safe instead of occasionally producing an unescaped
            # slash or another reserved character from base64.
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "MAVI_KEYS=1:$(openssl rand -base64 32 | tr -d '\n')"
            echo "MAVI_SITE_ID=$(cat /proc/sys/kernel/random/uuid)"
            echo "MAVI_DOMAIN=http://localhost"
            echo "MAVI_VERSION=${{ steps.version.outputs.tag }}"
          } > .env
          docker compose pull
          docker compose up -d

      - name: Run release smoke checks
        run: |
          if ! ./scripts/mavi-smoke.sh; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi

      - name: Tear down the smoke installation
        if: always()
        run: docker compose down -v
