# TLS may be terminated further out than this — a load balancer, a CDN, another
# nginx. When it is, the real scheme arrives in the header and $scheme is only
# this hop's, which is always http. Overwriting it made llms.txt advertise
# http:// addresses that answer 404, and every cover image on a generated site
# point at one.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

# The default format logs $remote_addr, which behind an ingress is the
# ingress: every line said 10.42.x.x and the log could not answer the one
# question an access log is kept for. The forwarded chain goes on the front,
# where a reader looks.
log_format visitor '$http_x_forwarded_for ($remote_addr) - [$time_local] '
                   '"$request" $status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log visitor;

    # TLS ends at the ingress, so nginx sees http and would send browsers to an
    # http:// address of its own making. Relative redirects keep the scheme the
    # browser already had.
    absolute_redirect off;

    # Nothing here is served by version number, and the 404 page was printing
    # one. It tells an attacker which advisories to read and nobody else
    # anything.
    server_tokens off;

    gzip on;
    # No woff2 here: it is a brotli stream in a wrapper, and gzipping it
    # spends the processor to add bytes.
    gzip_types text/css application/javascript application/json image/svg+xml;
    # nginx's default level is 1, tuned for proxies that compress every
    # response on the way through. These are files read from disk at most a
    # few times per visitor; the smaller answer is worth more than the
    # microseconds.
    gzip_comp_level 6;
    # Without this a shared cache can keep one encoding and hand it to a client
    # that did not ask for it.
    gzip_vary on;

    # nginx's own default is one megabyte, so every photograph worth uploading
    # was turned away here with a 413 before the API ever saw it. The
    # API already knows what each endpoint may take — ten megabytes for
    # media, two gigabytes for restoring a backup — and says so in words. This
    # is only wide enough to let a request reach the one that will judge it.
    client_max_body_size 2100m;

    # Nothing this server answers is for a search engine. A crawler reaching the
    # panel finds a sign-in form and indexes it, and then a customer searching
    # for their own site finds somebody's login page — this is the header that
    # takes it back out again, which robots.txt cannot do on its own.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # The panel is a sign-in form and a session cookie, and it had none of
    # these. HSTS is set here rather than at the ingress so it travels with the
    # image: whoever deploys this gets it without also having to know to ask.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Framing is the one that matters: without it a page elsewhere can put this
    # in an invisible frame and collect the clicks of somebody already signed
    # in. Nothing here is meant to be embedded anywhere, so nothing may be.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Only ever reached on the server's own address: a hosted site's "/" goes
    # to the site, and its robots.txt is the site's business.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # "api" is the service name on the compose network.
    location /api/ {
        # Streamed rather than spooled. With buffering on, nginx writes the
        # whole body to disk before the API can refuse it, so a ceiling
        # this high would be a way to fill the disk with requests that were
        # always going to be rejected. Off, the refusal arrives at the tenth
        # megabyte and nginx stops reading.
        proxy_request_buffering off;
        # An import of two gigabytes takes longer than the minute nginx waits
        # by default, and giving up on it returns a 504 for work still going on.
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;

        # Keep `/api/v1` intact. The Rust router owns the canonical prefix;
        # stripping it here turns every generated client call into `/v1`.
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # The API sets these itself, so that it is still safe when it is run
        # without this image in front of it. Here that would mean two of each,
        # and two content-security-policy headers are a policy nobody wrote.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    location /public/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /student/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # The address llms.txt and the README tell people to point a client at.
    # It answers on the site's own root rather than under /api, because it is
    # not one of this API's endpoints — it is the whole site, as tools.
    location /mcp {
        proxy_pass http://api:8080/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    # What the API says it is, for a client generated from it.
    location = /openapi.json {
        proxy_pass http://api:8080/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # What a site published, for every address that is a site rather than the
    # panel. The API decides which site from the address it was asked on.
    location = /llms.txt {
        proxy_pass http://api:8080/llms.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # The panel, and nothing else. Anything under it that is not a file is
    # the client-side router's business.
    location /admin {
        try_files $uri /admin/index.html;
    }

    # Where a student watches. Its own bundle, on the site's own address rather
    # than under /admin — somebody opening a course they paid for should be on
    # the site they bought it from. The page keeps its entry's name because
    # Vite names it after the source, and that is cheaper to write down here
    # than to work around there.
    location /shop {
        try_files $uri /shop/shop.html;
    }

    location /learn {
        try_files $uri /learn/learn.html;
    }

    # "/" is where a hosted site publishes. On a server that hosts sites this
    # location is never reached — the ingress sends "/" to the site — so this
    # is only what someone typing the bare address of the panel gets.
    location = / {
        return 302 /admin/;
    }

    # The page that names the others. Vite puts a hash in every asset filename,
    # so the assets below can be kept for ever — but only if this is not. Held
    # in a browser's cache it goes on asking for the chunks of the deploy
    # before last, and those are gone: the panel then fails to change page with
    # "Importing a module script failed" until somebody clears their cache.
    #
    # Every add_header from the server block is repeated here. nginx does not
    # inherit them into a location that sets any of its own, and dropping the
    # framing policy from the one response that is a page would be a poor way
    # to fix a caching bug.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }
}
