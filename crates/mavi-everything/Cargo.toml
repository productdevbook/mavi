[package]
name = "mavi-everything"
version = "0.0.0"
edition = "2024"
publish = false
description = "Everything this installation answers, and the questions no one domain can ask about itself."

[dependencies]
mavi-api = { path = "../mavi-api" }
mavi-audit = { path = "../mavi-audit" }
mavi-boards = { path = "../mavi-boards" }
mavi-content = { path = "../mavi-content" }
mavi-core = { path = "../mavi-core" }
mavi-courses = { path = "../mavi-courses" }
mavi-design = { path = "../mavi-design" }
mavi-flows = { path = "../mavi-flows" }
mavi-forms = { path = "../mavi-forms" }
mavi-mail = { path = "../mavi-mail" }
mavi-media = { path = "../mavi-media" }
mavi-people = { path = "../mavi-people" }
mavi-settings = { path = "../mavi-settings" }
mavi-shop = { path = "../mavi-shop" }
mavi-taxonomy = { path = "../mavi-taxonomy" }
mavi-db = { path = "../mavi-db" }
mavi-http = { path = "../mavi-http" }
mavi-serve = { path = "../mavi-serve" }
mavi-work = { path = "../mavi-work" }

serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tower = { workspace = true }

[lints]
workspace = true
