# Runs the published images. To build from this checkout instead:
#   docker compose -f docker-compose.dev.yml up --build
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mavi}
      # Asked for rather than defaulted. A default here is not a placeholder:
      # `:-` makes it the password the database actually runs with, so every
      # installation that followed the README shared one known credential to
      # the database holding every site on it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-mavi}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mavi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/productdevbook/mavi:${MAVI_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Point this at any PostgreSQL you like — the bundled "postgres"
      # service above is just the default.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-mavi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mavi}}
      HOST: 0.0.0.0
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
      # What seals every secret a site keeps: its mail password, its payment
      # keys. Asked for rather than defaulted, because a default here would
      # mean every installation sealed everything with one known key — and
      # because a key that changes on restart is a site whose secrets are
      # unreadable afterwards.
      MAVI_KEYS: ${MAVI_KEYS:?set MAVI_KEYS in .env — see .env.example}
      # The address this answers on, as somebody outside would type it. Asked
      # for rather than defaulted: it is what a link in a letter is built from,
      # a job sending one has no request to take an address off, and a guess
      # here would send everybody links that work on this machine alone.
      MAVI_URL: ${MAVI_URL:?set MAVI_URL in .env — see .env.example}
      # api, worker, or both. One process can do both; two make the queue
      # somebody else's problem when the API is busy.
      MAVI_ROLE: ${MAVI_ROLE:-both}
    volumes:
      # Uploaded media and the key that encrypts stored credentials live here.
      # Without this volume both are lost on every restart.
      - api-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    # Reached by the frontend over the compose network, by name, and not
    # published to the host. Published, it was a way round that frontend —
    # which is what puts the caller's real address on a request. Everything
    # keyed on that address (how often somebody may try a password, what the
    # log says a change was made from) is decided from a header the caller
    # writes, so a direct port lets one caller look like as many as it likes.
    #
    # To reach it while working on something, and only then:
    #   ports: ["127.0.0.1:8080:8080"]
    expose:
      - "8080"

  panel:
    image: ghcr.io/productdevbook/mavi-panel:${MAVI_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - api
    # Reached through caddy rather than published: one way in means one place
    # where the visitor's real address is written down, and everything that is
    # decided from that address — how often somebody may try a password, what
    # the record says a change was made from — is decided from a header the
    # proxy sets rather than one a caller can write.
    expose:
      - "80"

  # Certificates, and the address a site answers on. Anything can stand here —
  # this is nginx, Traefik, or whatever is already in front of your machine —
  # as long as it passes the `Host` header through and sets `X-Forwarded-For`
  # and `X-Forwarded-Proto`. Caddy is here because it asks for a certificate
  # by itself and its whole configuration is the four lines in ./Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - panel
    environment:
      # The address this answers on. Left as it is, it serves plain HTTP on
      # localhost, which is what you want while you are looking at it and
      # never what you want on a machine anybody else can reach.
      MAVI_DOMAIN: ${MAVI_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates it was given, so a restart is not a fresh request to
      # a rate-limited authority.
      - caddy-data:/data

volumes:
  postgres-data:
  api-data:
  caddy-data:
