# A process per test. Each one leases a database of its own for as long as the
# process lives, so a test that leaks state fails on its own rather than
# poisoning whatever ran beside it — and the lease ends when the process does,
# whether it passed or panicked.

[profile.ci]
# Every failure in one run: a run that stopped at the first would report one
# problem per push.
fail-fast = false

# Retrying a flaky test until it passes is how a flaky test stays.
retries = 0

[profile.ci.junit]
path = "junit.xml"
