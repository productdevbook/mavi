[workspace]
resolver = "3"
members = ["mavi-core", "mavi-db", "mavi-api", "mavi-assistant", "mavi-content", "mavi-people", "mavi-http", "mavi-taxonomy", "mavi-media", "mavi-forms", "mavi-health", "mavi-mail", "mavi-work", "mavi-audit", "mavi-settings", "mavi-shop", "mavi-courses", "mavi-flows", "mavi-design", "mavi-edge", "mavi-boards", "mavi-everything", "mavi-serve", "mavi-files", "mavi"]

# One place, so a member cannot quietly hold a different version of the thing
# beside it. A member names the dependency and says `workspace = true`.
[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio"] }
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "migrate",
  "macros",
] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
