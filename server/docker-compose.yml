# What it takes to run this: a Postgres, and one process that is both the API
# and its workers. Enough to try it; not what a machine serving other people's
# sites runs, which splits the two and holds its keys somewhere else.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: mavicms
      POSTGRES_DB: mavicms
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mavicms"]
      interval: 5s
      timeout: 3s
      retries: 20

  mavicms:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:mavicms@postgres:5432/mavicms
      # Nothing here is worth keeping, so a made-up key is allowed to be made
      # up. A machine with anything on it sets MAVI_KEYS instead.
      MAVI_INVENT_KEYS: "yes"
      # Where this answers, for the links in the letters it sends. Right for
      # something published on this machine's own port and wrong the moment
      # anybody else has to click one, which is why it is never a default.
      MAVI_URL: http://localhost:8080
      RUST_LOG: info
      UPLOADS_DIR: /data/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data

volumes:
  postgres:
  uploads:
