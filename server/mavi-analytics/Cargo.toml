[package]
name = "mavi-analytics"
version = "0.0.0"
edition = "2024"
publish = false
description = "How many times the site was read, and how it felt — without ever holding an address."

[dependencies]
mavi-api = { path = "../mavi-api" }
mavi-core = { path = "../mavi-core" }
mavi-db = { path = "../mavi-db" }

chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
