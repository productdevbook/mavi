[package]
name = "mavi-audit"
version = "0.0.0"
edition = "2024"
publish = false
description = "What was done, and by whom: one row per change, in the change's own transaction."

[features]
# A receipt for a change nothing made. For tests with no database, and nothing
# that ships turns it on — a receipt that can be conjured is not proof.
pretend = []

[dependencies]
mavi-api = { path = "../mavi-api" }
mavi-core = { path = "../mavi-core" }
mavi-db = { path = "../mavi-db" }
mavi-people = { path = "../mavi-people" }

chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
