[package]
name = "mavi-courses"
version = "0.0.0"
edition = "2024"
publish = false
description = "What somebody is learning: courses, the order they are in, and who is on them."

[dependencies]
mavi-api = { path = "../mavi-api" }
mavi-core = { path = "../mavi-core" }
mavi-db = { path = "../mavi-db" }
mavi-people = { path = "../mavi-people" }

chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
mavi-db = { path = "../mavi-db" }

sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
