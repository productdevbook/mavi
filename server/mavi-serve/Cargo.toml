[package]
name = "mavi-serve"
version = "0.0.0"
edition = "2024"
publish = false
description = "What makes an endpoint reachable: one gate, one shape of refusal, and a list of what is not mounted."

[dependencies]
mavi-api = { path = "../mavi-api" }
mavi-audit = { path = "../mavi-audit" }
mavi-core = { path = "../mavi-core" }
mavi-http = { path = "../mavi-http" }

axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
mavi-core = { path = "../mavi-core" }
# A receipt for a change nothing made. Nothing that ships turns this on.
mavi-audit = { path = "../mavi-audit", features = ["pretend"] }

tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tower = { workspace = true }

[lints]
workspace = true
